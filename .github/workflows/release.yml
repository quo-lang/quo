name: Create Release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  release:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: sudo apt update && sudo apt install -y libffi-dev libcurl4-openssl-dev

      - name: Compile Quo CLI
        run: make dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/quo-*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
