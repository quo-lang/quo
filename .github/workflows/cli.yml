name: Build Quo CLI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile Quo CLI
        run: ./build.sh -b release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: quo
