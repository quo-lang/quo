name: Build Quo CLI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile Quo CLI
        run: ./build.sh -b release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: quo
          tag_name: ${{ github.ref_name }}
