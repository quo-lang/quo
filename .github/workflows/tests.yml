name: Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: sudo apt update && sudo apt install -y libffi-dev libcurl4-openssl-dev

      - name: Run Tests
        run: make check
